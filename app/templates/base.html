<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LinkKısaltıcı{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero { padding: 3rem 0 1rem; }
        .narrow { max-width: 720px; }
        .result-box { padding: 1rem 1.5rem; border: 1px dashed #0d6efd; border-radius: .75rem; background: #f4f8ff; }
        .original-url { max-width: 380px; }
        .stat-card { border-radius: .75rem; }
        .bar { height: .5rem; border-radius: 1rem; background: #e9ecef; overflow: hidden; }
        .bar > span { display: block; height: 100%; background: #0d6efd; border-radius: 1rem; }
    </style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar bg-white border-bottom">
    <div class="container"><a class="navbar-brand fw-semibold" href="/">🔗 LinkKısaltıcı</a></div>
</nav>

<main class="container pb-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small py-4">&copy; 2026 LinkKısaltıcı</footer>

<script>
    function copyText(text, button) {
        navigator.clipboard.writeText(text);
        const old = button.textContent;
        button.textContent = 'Kopyalandı ✓';
        setTimeout(() => button.textContent = old, 2000);
    }
</script>
</body>
</html>
